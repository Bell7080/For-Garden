 [[-3,-3,1.2],[2,-4.2,1],[-5,-1,1.1],[4,-1.5,.9],[0,-5.5,1.3]].forEach(([x,z,s],i)=>L.palm(scene,x,z,s,i));
 // 산
 add(scene,new THREE.ConeGeometry(3,4,7),toon(0x4f9d4a),[-1.5,1.7,-3]);add(scene,new THREE.ConeGeometry(2.2,3,7),toon(0x5aa84f),[1.6,1.2,-3.6]);
 const d=L.makeDodo(scene,{scale:.35});d.g.position.set(1.8,0,2.2);

 const gulls=[];for(let i=0;i<4;i++){const g=new THREE.Group();scene.add(g);add(g,S(.25,10,8),toon(0xffffff),[0,0,0],[1.6,.4,.5]);gulls.push(g);}
 return t=>{const k=easeIO(t/2.75);const a=.6+t*.12,dist=lerp(46,24,k),h=lerp(30,11,k);cam.position.set(Math.sin(a)*dist,h,Math.cos(a)*dist);cam.lookAt(0,1.2,0);
  upd(t);d.idle(t);gulls.forEach((g,i)=>{const p=t*.8+i*1.6;g.position.set(Math.cos(p)*9,7+Math.sin(p*2)*.4,Math.sin(p)*9);g.rotation.y=-p;g.children[0].rotation.z=Math.sin(t*10+i)*.3;});

// 3. 숲속 도도새들 — 천적이 없어서 날 필요도 없었다
SC.forest=()=>{const {scene,cam}=mk({sky:['#57a6d9','#bfe6f5','#f2fbe8'],sunPos:[-5,10,6]});
 add(scene,C(30,30,.4,48),toon(0x77c25e),[0,-.2,0],null,null,false).receiveShadow=true;
 const r=rnd(7);for(let i=0;i<16;i++){const a=r()*6.28,dd=8+r()*10;L.tree(scene,Math.cos(a)*dd,Math.sin(a)*dd-4,.9+r()*.6);}
 for(let i=0;i<10;i++){const a=r()*6.28,dd=4+r()*6;L.bush(scene,Math.cos(a)*dd,Math.sin(a)*dd-2,.6+r()*.5);}
 const fruit=[];for(let i=0;i<8;i++)fruit.push(add(scene,S(.18,12,8),toon(0xe85a4a),[r()*8-4,.18,r()*4-1]));
 const ds=[[-2.4,-.5,.7,.6],[2.6,-1.2,.75,2.1],[-.4,-3,.6,3.3],[3.2,1.6,.55,4]].map(([x,z,s,ph])=>{const d=L.makeDodo(scene,{scale:s});d.g.position.set(x,0,z);d.g.rotation.y=ph;return [d,ph];});
 const hero=L.makeDodo(scene,{scale:.95});hero.g.position.set(0,0,1.5);
 return t=>{const a=-.15+t*.05;cam.position.set(Math.sin(a)*14,4.6,Math.cos(a)*14+1.5);cam.lookAt(0,1.8,.5);
  ds.forEach(([d,ph],i)=>{d.idle(t,ph);if(i%2){d.walk(t,.5,ph);d.g.position.x+=Math.sin(d.g.rotation.y)*.008;d.g.position.z+=Math.cos(d.g.rotation.y)*.008;}else{d.head.rotation.x=.5+Math.sin(t*6+ph)*.25;}});
  hero.idle(t);
  // 1.6초부터 퍼덕여 보지만 겨우 콩 뛰고 털썩
  const ft=t-1.5;if(ft>0&&ft<1.2){hero.flap(t,1);hero.g.position.y=Math.max(0,Math.sin(Math.min(1,ft/1.0)*Math.PI)*.55);}else{hero.flap(0,0);hero.g.position.y=0;}

// 5. 상륙 — 사람들이 배를 타고 왔어요
SC.landing=()=>{const {scene,cam}=mk({sky:['#4f86c6','#a7d6ef','#fff0c8'],sunPos:[-6,10,8]});

 return t=>{upd(t);const bz=lerp(9,4.4,easeIO(t/1.2));boat.position.set(0,Math.sin(t*3)*.06,bz);boat.rotation.y=Math.PI/2*0;oar.rotation.x=Math.sin(t*5)*.5;
  sail.forEach((s,i)=>{const jt=1.2+i*.22;if(t<jt){s.g.position.set((i-1)*.6,.55+boat.position.y,bz+(i-1)*.9);s.g.rotation.y=Math.PI;s.walk(0,0);}
   else{const w=t-jt;const air=w<.35;s.g.position.set((i-1)*1.1,air?.55+Math.sin(w/.35*Math.PI)*1.0:0,lerp(bz,1.2-i*.3,clamp01(w/.35))-Math.max(0,w-.35)*1.3);s.g.rotation.y=Math.PI;if(!air)s.walk(w,1.1);}});

 add(scene,C(30,30,.4,48),toon(0x77c25e),[0,-.2,0],null,null,false).receiveShadow=true;L.tree(scene,-5,-6,1.3);L.tree(scene,4,-7,1.1);L.bush(scene,-3,-2,.9);L.bush(scene,3.5,-2.5,.8);

  s.arms[1].rotation.x=t>1.6?-lerp(0,1.6,ease((t-1.6)/.6)):0;

// 6-2. 잡아먹기도 했지만 — 주범은 아니었다
SC.hunt=()=>{const {scene,cam}=mk({sky:['#5b8fd0','#b4dcf0','#fff3d0'],sunPos:[-6,9,7]});
 L.sea(scene);add(scene,C(9,10,.6,48),toon(0xf2d39a),[0,-.3,0],null,null,false).receiveShadow=true;L.palm(scene,-4,-3,1.2);L.palm(scene,4.2,-4,1);

 const a=L.makeSailor(scene,{scale:1.15});const b=L.makeSailor(scene,{scale:1.15,coat:0x9e3a2f});
 const d1=L.makeDodo(scene,{scale:.9});const d2=L.makeDodo(a.g,{scale:.55});d2.g.position.set(0,2.55,.1);d2.g.rotation.x=.4;
 const q=label(scene,'주범?',{size:200,w:768,fill:'#fff6c8'});q.position.set(0,5.3,0);

 [1,-1].forEach(k=>{const m=new THREE.Mesh(new THREE.BoxGeometry(3.6,.42,.1),xm);m.rotation.z=k*.75;xg.add(m);});xg.position.set(0,5.3,.4);
 return t=>{// 선원 b가 도도새를 쫓고, 선원 a는 한 마리를 머리 위로 들고 배로 간다
  const ct=Math.min(t,3.1);d1.walk(t,1.4);d1.g.position.set(-4.2+ct*1.0,0,2.6);d1.g.rotation.y=Math.PI/2;
  b.walk(ct,t<3.1?1.4:0);b.g.position.set(-6.4+ct*1.0,0,2.3);b.g.rotation.y=Math.PI/2;b.arms[1].rotation.x=-1.5;b.arms[0].rotation.x=-1.2;
  a.walk(Math.min(t,3.1),t<3.1?.9:0);a.g.position.set(.9+Math.min(t,3.1)*.3,0,-2.6+Math.min(t,3.1)*.2);a.g.rotation.y=.9;
  a.arms[0].rotation.x=-2.9;a.arms[1].rotation.x=-2.9;d2.flap?d2.flap(t):d2.idle(t);
  // 3.1초 정지 → 주범? → 4.1초 X 도장
  setSprite(q,1.5,t>3.2?pop(t,3.2):0);const xk=t>4.1?clamp01((t-4.1)/.12):0;xg.visible=t>4.1;xg.scale.setScalar(lerp(2.2,1,xk));
  const sh=t>4.1&&t<4.4?Math.sin(t*60)*.08:0;

// 7. 진범 공개 — 나무 상자 속 빛나는 눈
SC.crate=()=>{const {scene,cam}=mk({sky:['#1d2350','#3a3f7a','#5a4f7a'],hemi:.9,sunI:1.0,sunPos:[-4,8,6]});
 add(scene,C(30,30,.4,48),toon(0x3a4a5a),[0,-.2,0],null,null,false).receiveShadow=true;
 const crate=new THREE.Group();scene.add(crate);const bx=add(crate,new THREE.BoxGeometry(2.6,2,2),toon(0x8a5a32),[0,1,0]);
 for(const y of[.3,1.7])add(crate,new THREE.BoxGeometry(2.7,.22,2.1),toon(0x6a4024),[0,y,0],null,null,false);
 const lid=add(crate,new THREE.BoxGeometry(2.8,.2,2.2),toon(0x6a4024),[0,2.1,0]);
 const spot=new THREE.SpotLight(0xffe2a0,40,20,.5,.6);spot.position.set(0,9,3);spot.target=crate;scene.add(spot);
 const eyes=[];const em=new THREE.MeshBasicMaterial({color:0xfff06a});[[-.6,.8],[ -.3,.8],[.45,1.25],[.75,1.25],[-.05,.45],[.25,.45]].forEach(([x,y])=>eyes.push(add(crate,S(.09,10,8),em,[x,y,1.02],[1,.6,.3],null,false)));

 return t=>{const shake=t>.6?Math.sin(t*40)*.04*(1-clamp01((t-1.8)/.6)):0;crate.position.x=shake;crate.rotation.z=shake*.5;

 const d=L.makeDodo(scene,{scale:.9});d.g.position.set(0,.9,0);d.g.rotation.y=-.5;
 const sun=add(scene,S(6,24,16),new THREE.MeshBasicMaterial({color:0xffb070,fog:false}),[-40,4,-90],null,null,false);
 const lb=label(scene,'1662',{size:230,fill:'#ffe066'});lb.position.set(0,5.2,0);
 return t=>{upd(t);d.idle(t*.6);d.head.rotation.x=.25+Math.sin(t*.8)*.05;d.head.rotation.y=-.3+Math.sin(t*.5)*.25;
  const a=.9-t*.08;cam.position.set(Math.sin(a)*14,3.8+t*.15,Math.cos(a)*14);cam.lookAt(0,2.6,0);
  setSprite(lb,1.9,t>.3?pop(t,.3,.25):0);lb.material.opacity*=t>2.8?clamp01(1-(t-2.8)/.6):1;};};
// 11. 사라짐 — 입자로 흩어짐
SC.dissolve=()=>{const {scene,cam}=mk({sky:['#1c1d48','#5a3f6a','#a0607a'],hemi:.8,sunC:0xff9a6a,sunI:1.4,sunPos:[-8,4,-4]});
 L.sea(scene,0x22406a);L.island(scene,{r:5,grassR:3.5,sandC:0xc8a270,grassC:0x456f48});add(scene,C(.9,1.1,1,16),toon(0x7a5236),[0,.4,0]);
 const d=L.makeDodo(scene,{scale:.9});d.g.position.set(0,.9,0);d.g.rotation.y=-.5;
 const mats=[];d.g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;mats.push(o.material);}});
 const N=500,pp=new Float32Array(N*3),sd=[];const r=rnd(13);for(let i=0;i<N;i++){const y=1+r()*3.2;sd.push([(r()-.5)*1.8,y,(r()-.5)*1.6,r()*6.28,r()]);}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pp,3));
 const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffd9a8,size:.09,transparent:true}));scene.add(pts);
 const stars=L.dust(scene,{n:120,color:0xffffff,box:[40,20,10],y0:6,size:.12});
 return t=>{stars(t*.2);const k=clamp01((t-.6)/2.2);mats.forEach(m=>m.opacity=1-k);d.g.position.y=.9+k*.3;
  for(let i=0;i<N;i++){const s=sd[i];const go=clamp01(k*1.4-s[4]*.4);pp[i*3]=s[0]+Math.sin(t+s[3])*go*1.5+go*2.5;pp[i*3+1]=s[1]+go*4.5;pp[i*3+2]=s[2]+Math.cos(t+s[3])*go;}
  geo.attributes.position.needsUpdate=true;pts.material.opacity=k>0?Math.min(1,k*4)*(1-clamp01((t-2.9)/.6)):0;
  cam.position.set(7,3.6+t*.3,11+t*.4);cam.lookAt(0,2.6+t*.25,0);};};
// 12. 박물관 골격
SC.museum=()=>{const {scene,cam}=mk({sky:['#2a2530','#3a3240','#4a3f48'],hemi:.7,sunI:.8,sunPos:[2,9,6]});
 add(scene,new THREE.BoxGeometry(40,.2,40),toon(0x6a4a3a),[0,-.1,0],null,null,false).receiveShadow=true;
 add(scene,new THREE.BoxGeometry(40,20,.4),toon(0x7a6a5a),[0,10,-6],null,null,false);
 const ped=add(scene,new THREE.BoxGeometry(3.4,1.2,2.4),toon(0x3a2a24),[0,.6,0]);
 const glass=new THREE.Mesh(new THREE.BoxGeometry(3.2,3.8,2.2),new THREE.MeshPhongMaterial({color:0xbfe8ff,transparent:true,opacity:.15,shininess:120}));glass.position.set(0,3.1,0);scene.add(glass);
 const ge=new THREE.LineSegments(new THREE.EdgesGeometry(glass.geometry),new THREE.LineBasicMaterial({color:0xdff6ff}));glass.add(ge);
 const bone=toon(0xf1e8d2);const sk=new THREE.Group();sk.position.set(0,1.2,0);scene.add(sk);
 for(let i=0;i<8;i++){const a=-.4+i*.11;add(sk,new THREE.TorusGeometry(.6-i*.02,.05,6,16,Math.PI*1.2),bone,[0,1.3,-.5+i*.14],null,[0,0,Math.PI*1.4]);}
 add(sk,C(.06,.06,1.6,6),bone,[0,1.9,0],null,[Math.PI/2.4,0,0]);
 for(let i=0;i<6;i++)add(sk,S(.11,8,6),bone,[0,2.0+i*.15,.5+i*.06]);
 const skull=add(sk,S(.38,16,12),bone,[0,2.95,.85],[.9,.85,1]);add(sk,S(.22,16,12),bone,[0,2.85,1.35],[.7,.7,1.7]);add(sk,S(.13,12,8),bone,[0,2.72,1.7]);
 add(sk,S(.09,8,6),new THREE.MeshBasicMaterial({color:0x1a1410}),[.22,3.0,1.0],null,null,false);
 for(const x of[-.35,.35]){add(sk,C(.05,.05,.9,6),bone,[x,.55,.1]);add(sk,C(.04,.04,.4,6),bone,[x,.08,.3],null,[Math.PI/2,0,0]);}
 const plate=label(scene,'Raphus cucullatus',{size:90,fill:'#f2e2b8',stroke:'#2a1d18'});plate.position.set(0,.6,1.45);
 const spot=new THREE.SpotLight(0xfff0d0,60,20,.35,.5);spot.position.set(0,9,2);spot.target=sk;scene.add(spot);
 const motes=L.dust(scene,{n:60,color:0xfff0c0,box:[4,6,3],y0:1,size:.05});
 return t=>{motes(t);plate.visible=false;const a=.75+t*.1;cam.position.set(Math.sin(a)*9,3.8,Math.cos(a)*9);cam.lookAt(0,2.6,0);};};
// 13. 옛 그림 — 액자
SC.painting=()=>{const {scene,cam}=mk({sky:['#2a2530','#3a3240','#4a3f48'],hemi:.8,sunI:.9,sunPos:[2,8,8]});
 add(scene,new THREE.BoxGeometry(40,20,.4),toon(0x6a3a3a),[0,8,-.5],null,null,false);
 const fr=new THREE.Group();scene.add(fr);fr.position.set(0,4,0);
 add(fr,new THREE.BoxGeometry(4.6,5.8,.35),toon(0xc99a3a),[0,0,0]);add(fr,new THREE.BoxGeometry(4.0,5.2,.4),toon(0x8a6420),[0,0,.02],null,null,false);
 const tl=new THREE.TextureLoader();const tex=tl.load(new URLSearchParams(location.search).get('img')||'paint.png',()=>{window.ready=true;},undefined,()=>{window.ready=true;});tex.colorSpace=THREE.SRGBColorSpace;
 const canvas=new THREE.Mesh(new THREE.PlaneGeometry(3.7,4.9),new THREE.MeshBasicMaterial({map:tex}));canvas.position.z=.23;fr.add(canvas);
 const spot=new THREE.SpotLight(0xfff0d0,50,20,.4,.5);spot.position.set(0,10,5);spot.target=fr;scene.add(spot);
 const motes=L.dust(scene,{n:50,color:0xfff0c0,box:[6,6,3],y0:1,size:.05});
 window.__noReady=true;
 return t=>{motes(t);const k=easeIO(t/3.5);cam.position.set(lerp(-2.5,0,k),lerp(3.4,4,k),lerp(12,8.6,k));cam.lookAt(0,4,0);};};

const upd=SC[name]();if(!window.__noReady)window.ready=true;
window.renderFrame=f=>{const t=f/30;upd(t);renderer.render(window.__scene,window.__cam);return renderer.domElement.toDataURL('image/jpeg',.92);};
